<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoTech Gadgets — Smarter Tech. Better Life.</title>
    <meta name="description" content="NeoTech Gadgets — Nigeria's premier destination for smartphones, laptops, tablets, premium audio and accessories. Nationwide delivery with flexible installment plans.">
    <meta name="theme-color" content="#D42B2B">
    <!-- Google Fonts: Rajdhani (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --nt-red:        #D42B2B;
        --nt-red-dark:   #A01E1E;
        --nt-red-glow:   #FF3030;
        --nt-chrome:     #C8C8D4;
        --nt-silver:     #9898A8;
        --nt-bg:         #0E0E10;
        --nt-surface:    #161618;
        --nt-surface2:   #1E1E22;
        --nt-border:     #2A2A30;
        --nt-text:       #E8E8F0;
        --nt-muted:      #7070808;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0E0E10; }
      ::-webkit-scrollbar-thumb { background: #D42B2B; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #FF3030; }

      /* Smooth transition base */
      .transition-all-300 { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
  </head>
  <body class="bg-[#0E0E10] text-gray-200 font-sans overflow-x-hidden w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
